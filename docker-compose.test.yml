name: stratum-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stratum_test
      POSTGRES_USER: stratum_test
      POSTGRES_PASSWORD: stratum_test_password
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum_test -d stratum_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

