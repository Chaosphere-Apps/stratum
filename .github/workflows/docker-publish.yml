name: Docker Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GHCR from this run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            image: stratum-ui
            context: ./ui
            file: ./ui/Dockerfile
          - name: backend
            image: stratum-backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: all-in-one
            image: stratum-allinone
            context: .
            file: ./Dockerfile_allinone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/') ||
          github.event.inputs.publish == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=Stratum ${{ matrix.name }}
            org.opencontainers.image.description=Stratum ${{ matrix.name }} container image

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: >-
            ${{ github.event_name != 'pull_request' &&
            (startsWith(github.ref, 'refs/tags/') ||
            github.event.inputs.publish == 'true') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stratum-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=stratum-${{ matrix.name }}
          provenance: mode=max
          sbom: true
