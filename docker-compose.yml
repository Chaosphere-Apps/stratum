services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stratum
      POSTGRES_USER: stratum
      POSTGRES_PASSWORD: stratum_dev_password
    ports:
      - "5432:5432"
    volumes:
      - stratum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum -d stratum"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      BACKEND_ADDR: :8081
      DATABASE_URL: postgres://stratum:stratum_dev_password@postgres:5432/stratum?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*,http://[::1]:*
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stratum-postgres-data:
